{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body>
    <header>
        <h1><a href="/">My Django Blog</a></h1>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'blog/js/scripts.js' %}"></script>
</body>
</html>
